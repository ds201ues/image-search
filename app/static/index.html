<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f4f1;--surface:#ffffff;--ink:#141416;--ink-2:#55555c;--ink-3:#8c8c93;--line:#e1e1dc;--line-2:#cfcfc8;
 --accent:#c4161c;--accent-ink:#ffffff;--well:#0f0f10;--well-ink:#ededea;--chip:#ebebe6;--focus:#1b5fd6;
 --display:"Bricolage Grotesque",Inter,system-ui,sans-serif;--body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 --row:230px;--gap:6px;--r:4px;
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
 --bg:#141416;--surface:#1c1c1f;--ink:#ececea;--ink-2:#b2b2b8;--ink-3:#7c7c84;--line:#2a2a2e;--line-2:#3a3a40;
 --accent:#ff5a5f;--accent-ink:#141416;--well:#0a0a0b;--well-ink:#ededea;--chip:#26262a;--focus:#7aa7ff;}}
:root[data-theme="dark"]{
 --bg:#141416;--surface:#1c1c1f;--ink:#ececea;--ink-2:#b2b2b8;--ink-3:#7c7c84;--line:#2a2a2e;--line-2:#3a3a40;
 --accent:#ff5a5f;--accent-ink:#141416;--well:#0a0a0b;--well-ink:#ededea;--chip:#26262a;--focus:#7aa7ff;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);font-feature-settings:"cv11","ss01"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header: the search is the headline ---------- */
header{padding:22px clamp(16px,3vw,40px) 0;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.brand{font:700 26px/1 var(--display);font-variation-settings:"opsz" 96;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand i{display:inline-block;width:14px;height:14px;background:var(--accent);border-radius:3px;transition:transform .2s}
.brand:hover i{transform:rotate(45deg)}
.brand:hover{color:var(--accent)}
.archive{font:12px/1 var(--mono);color:var(--ink-3)}
.searchrow{display:flex;align-items:center;gap:10px;margin-top:14px;border-bottom:2px solid var(--ink);padding-bottom:8px;transition:border-color .15s}
.searchrow:focus-within{border-color:var(--accent)}
.searchrow svg{flex:none;width:22px;height:22px;color:var(--ink-3)}
#q{flex:1;min-width:0;border:0;outline:none;background:none;padding:4px 0;font:500 clamp(20px,2.6vw,30px)/1.2 var(--display);letter-spacing:-.01em;color:var(--ink)}
#q::placeholder{color:var(--ink-3)}
#q::-webkit-search-cancel-button{display:none}
.clear{color:var(--ink-3);font-size:13px;padding:4px 8px;border-radius:var(--r)}
.clear:hover{color:var(--ink)}
.go{background:var(--ink);color:var(--bg);font-weight:600;padding:9px 16px;border-radius:var(--r);white-space:nowrap}
.go:hover{background:var(--accent);color:var(--accent-ink)}
.subrow{position:relative;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:10px 0 12px;min-height:44px}
.hint{color:var(--ink-3);font-size:12.5px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{font-size:12.5px;color:var(--ink-2);padding:4px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface)}
.sugg button:hover{border-color:var(--ink);color:var(--ink)}
.controls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:0 8px;height:30px}
.ctl input{width:48px;border:0;background:none;padding:0;text-align:center;font:500 12.5px var(--mono);color:var(--ink)}
.ctl input::-webkit-inner-spin-button{display:none}
.ctl input.name{width:170px;text-align:left;font:12.5px var(--body)}
.ctl input.name::placeholder{color:var(--ink-2)}
.ctl.on{border-color:var(--ink)}

/* ---------- status line ---------- */
.status{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px clamp(16px,3vw,40px) 6px;color:var(--ink-2);font-size:13px;min-height:40px}
.status b{color:var(--ink);font-weight:600}
.status .ms{font:12px var(--mono);color:var(--ink-3)}
.understood{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink-2)}
.tag.person{background:var(--ink);color:var(--bg)}
.tag.person.maybe{background:var(--chip);color:var(--ink-2);border:1px dashed var(--line-2)}
.status .warn{color:var(--accent)}
.status .retry,.status .back{font-size:12.5px;color:var(--ink);padding:3px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface)}
.status .retry:hover,.status .back:hover{border-color:var(--ink)}
.status .sim{display:inline-flex;align-items:center;gap:8px}
.status .sim img{width:34px;height:26px;object-fit:cover;border-radius:3px;display:block}

/* ---------- results: justified rows, whole images ---------- */
main{padding:0 clamp(16px,3vw,40px) 80px}
.tier{margin-top:18px}
.tier h2{font:600 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.tier h2 small{font:12px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.tier h2.best::before{content:"";width:8px;height:8px;background:var(--accent);border-radius:1px}
.tier .note{margin:-4px 0 12px;color:var(--ink-2);font-size:13px}
.rows{display:flex;flex-wrap:wrap;gap:var(--gap)}
.rows::after{content:"";flex-grow:1e6;flex-basis:0;min-width:0}
.ph{position:relative;flex-grow:calc(var(--ar) * 100);flex-basis:calc(var(--ar) * var(--row));aspect-ratio:var(--ar);min-width:0;margin:0;border-radius:var(--r);overflow:hidden;background:var(--chip);cursor:zoom-in;outline-offset:-2px;container-type:inline-size}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.ph img.in{opacity:1}
.ph .cap{position:absolute;inset:auto 0 0 0;padding:36px 10px 8px;color:#fff;font-size:12px;line-height:1.35;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.78) 100%);opacity:0;transition:opacity .15s;pointer-events:none}
.ph .cap .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.ph .cap .m{display:flex;gap:8px;margin-bottom:3px;font:11px var(--mono);color:rgba(255,255,255,.75)}
.ph .cap .src{color:#ffd400;text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.ph:hover .cap,.ph:focus-visible .cap{opacity:1}
.ph .who{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.ph .who span{font-size:11px;font-weight:500;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.92);color:#141416;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.ph .who span.maybe{background:rgba(20,20,22,.6);color:#fff;border:1px dashed rgba(255,255,255,.5)}
.ph .who .n1{display:none}
@container (max-width:230px){.ph .who .p2,.ph .who .n2{display:none}.ph .who .n1{display:inline}.ph .who span{max-width:calc(100cqw - 56px)}}
.tier.more .ph{filter:saturate(.85)}
.tier.more .ph:hover{filter:none}
@media (hover:none){.ph .cap{opacity:1}}
@media (max-width:720px){:root{--row:150px}.subrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px}.subrow::-webkit-scrollbar{display:none}.sugg{flex-wrap:nowrap}.sugg button{white-space:nowrap}.controls{margin-left:0;flex-wrap:nowrap}}

/* skeleton + empty */
.loader{min-height:calc(100vh - 230px);display:grid;place-items:center;text-align:center}
.loader .orbwrap{display:flex;flex-direction:column;align-items:center;gap:4px;animation:fadein .25s ease-out}
.loader canvas{width:300px;height:300px;display:block}
.loader .ltitle{font:500 clamp(18px,2.2vw,24px)/1.2 var(--display);letter-spacing:-.01em;color:var(--ink)}
.loader .ltitle b{font-weight:600}
.loader .lstep{font:12.5px var(--mono);color:var(--ink-3);min-height:18px;transition:opacity .2s}
.loader .lstep.swap{opacity:0}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rows,.tier h2{animation:fadein .3s ease-out}
@media (max-width:720px){.loader canvas{width:180px;height:180px}.loader{min-height:50vh}}
.empty{max-width:560px;margin:60px auto;text-align:center;color:var(--ink-2)}
.empty h3{font:600 22px/1.25 var(--display);color:var(--ink);margin:0 0 8px;letter-spacing:-.01em}
.empty p{margin:0 0 14px}
.empty .sugg{justify-content:center}
.start{max-width:760px;margin:48px auto 0}
.start h3{font:600 clamp(26px,4vw,40px)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 10px}
.start p{color:var(--ink-2);font-size:15px;margin:0 0 22px;max-width:52ch}
.start .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 24px;margin-top:26px}
.start h4{font:600 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.start .cols button{display:block;text-align:left;color:var(--ink);padding:5px 0;font-size:14px;border-bottom:1px solid var(--line);width:100%}
.start .cols button:hover{color:var(--accent)}

/* ---------- viewer ---------- */
dialog.viewer{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh;margin:0}
dialog.viewer::backdrop{background:rgba(8,8,9,.9)}
.vwrap{display:grid;grid-template-columns:1fr 400px;height:100%;background:var(--well);color:var(--well-ink)}
.stage{position:relative;display:grid;place-items:center;min-width:0;min-height:0;padding:20px}
.stage img{max-width:100%;max-height:calc(100vh - 40px);width:auto;height:auto;object-fit:contain;display:block;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.stage .boxes{position:absolute;pointer-events:none}
.stage .box{position:absolute;border:1.5px solid #ffd400;border-radius:2px}
.stage .box em{position:absolute;left:-1.5px;bottom:100%;background:#ffd400;color:#000;font:11px var(--mono);font-style:normal;padding:1px 5px;white-space:nowrap}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.08);border-radius:var(--r);opacity:.7}
.nav:hover{opacity:1;background:rgba(255,255,255,.16)}
.nav.prev{left:14px}.nav.next{right:14px}
.nav svg{width:22px;height:22px}
.counter{position:absolute;left:20px;bottom:16px;font:12px var(--mono);color:rgba(255,255,255,.6)}
.panel{background:var(--surface);color:var(--ink);overflow:auto;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.panel .head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.panel .head .k{font:12px var(--mono);color:var(--ink-3)}
.close{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2)}
.close:hover{background:var(--chip);color:var(--ink)}
.close svg{width:18px;height:18px}
.panel .body{padding:18px;flex:1}
.panel .caption{font:500 16px/1.4 var(--display);letter-spacing:-.005em;margin:0 0 6px;text-wrap:pretty}
.panel .headline{color:var(--ink-2);margin:0 0 14px;font-size:13.5px}
.panel .ai{font-size:13.5px;color:var(--ink-2);margin:0 0 14px;padding-left:10px;border-left:2px solid var(--line-2)}
.panel .ai small{display:block;font:11px var(--mono);color:var(--ink-3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.facts{display:grid;grid-template-columns:92px 1fr;gap:9px 12px;font-size:13.5px;margin:16px 0}
.facts dt{color:var(--ink-3);font-size:12.5px;padding-top:1px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts dd.mono{font:12.5px var(--mono)}
.people{display:flex;flex-wrap:wrap;gap:5px}
.people span{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--ink);color:var(--bg)}
.people span.maybe{background:var(--chip);color:var(--ink-2);border:1px dashed var(--line-2)}
.kw{display:flex;flex-wrap:wrap;gap:4px}
.kw span{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--ink-2)}
.actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--line-2);font-weight:500;font-size:13.5px;text-decoration:none;background:var(--surface)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:15px;height:15px}
.debug{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line-2);font:12px/1.5 var(--mono);color:var(--ink-3);white-space:pre-wrap}
@media (max-width:900px){.vwrap{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.stage img{max-height:55vh}.panel{max-height:45vh;border-left:0;border-top:1px solid var(--line)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r);font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
 <div class="masthead">
 <a class="brand" href="/" id="home"><i></i>Photo Desk</a>
 <div class="archive" id="archive"></div>
 </div>
 <form id="f" role="search">
 <div class="searchrow">
 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
 <label class="sr" for="q">Describe the photo you need</label>
 <input type="search" id="q" placeholder="Describe the photo you need" autocomplete="off" autofocus spellcheck="false">
 <button type="button" class="clear" id="clear" hidden>Clear</button>
 <button class="go" type="submit">Search</button>
 </div>
 <div class="subrow">
 <span class="hint" id="hint">Try</span>
 <div class="sugg" id="sugg"></div>
 <div class="controls">
 <label class="ctl" id="yearctl"><span>Year</span><input id="yf" type="number" placeholder="from" min="1950" max="2030"><span>–</span><input id="yt" type="number" placeholder="to" min="1950" max="2030"></label>
 <label class="ctl" id="personctl"><span>Person</span><input class="name" id="person" list="people" placeholder="Anyone" autocomplete="off"><datalist id="people"></datalist></label>
 </div>
 </div>
 </form>
</header>
<div class="status" id="status"></div>
<main id="main"></main>

<dialog class="viewer" id="viewer">
 <div class="vwrap">
 <div class="stage" id="stage">
 <img id="big" alt="">
 <div class="boxes" id="boxes"></div>
 <button class="nav prev" id="prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
 <button class="nav next" id="next" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
 <div class="counter" id="counter"></div>
 </div>
 <aside class="panel" id="panel"></aside>
 </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEBUG=new URLSearchParams(location.search).has('debug');
const EXAMPLES=['delhi smog over india gate','flooded street people wading','farmers protest with tractors','rahul gandhi smiling','cricket team celebrating with trophy','traffic jam on highway','students celebrating exam results','police lathi charge on protesters'];
const STARTERS={
 'Civic & weather':['delhi smog over india gate','flooded street people wading','traffic jam on highway','garbage dump in city','potholes on road after rain'],
 'Politics':['rahul gandhi smiling','modi in pink jacket','chief minister addressing a rally','oath taking ceremony of ministers','voters queue at polling booth'],
 'Sport & culture':['cricket team celebrating with trophy','kabaddi match','ganesh visarjan procession','fashion show models on ramp','classical dance performance on stage'],
};
let res=null, cur=-1, stats=null;
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const recent=()=>{try{return JSON.parse(localStorage.recent||'[]')}catch{return[]}};
const remember=q=>{try{localStorage.recent=JSON.stringify([q,...recent().filter(x=>x!==q)].slice(0,6))}catch{}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---- header ---- */
function suggestions(){const r=recent();const list=[...r,...EXAMPLES.filter(e=>!r.includes(e))].slice(0,6);$('#hint').textContent=r.length?'Recent':'Try';
 $('#sugg').innerHTML=list.map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b){$('#q').value=b.dataset.q;run()}});
$('#q').addEventListener('input',()=>{$('#clear').hidden=!$('#q').value});
$('#clear').onclick=()=>{$('#q').value='';$('#clear').hidden=true;$('#q').focus();history.replaceState(null,'',location.pathname);start()};
$('#home').onclick=e=>{e.preventDefault();$('#q').value='';$('#clear').hidden=true;$('#yf').value=$('#yt').value=$('#person').value='';
 $('#yearctl').classList.remove('on');$('#personctl').classList.remove('on');res=null;history.replaceState(null,'',location.pathname+(DEBUG?'?debug=1':''));start();window.scrollTo(0,0);$('#q').focus()};
$('#f').onsubmit=e=>{e.preventDefault();run()};
const peopleIds=new Map();
const personId=()=>{const v=$('#person').value.trim().toLowerCase();return v?peopleIds.get(v)||'':''};
$('#person').onchange=()=>{const v=$('#person').value.trim();if(v&&!personId()){toast(`No one named “${v}” in the archive`);return}$('#personctl').classList.toggle('on',!!v);if(res||v)run()};
$('#yf').onchange=$('#yt').onchange=()=>{if(res)run()};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&!$('#viewer').open){e.preventDefault();$('#q').focus();$('#q').select()}});

async function loadStats(){try{stats=await (await fetch('/api/stats')).json();
 $('#archive').textContent=`${stats.images.toLocaleString('en-IN')} photos · ${stats.date_min?.slice(0,4)||''}–${stats.date_max?.slice(0,4)||''}`;
 peopleIds.clear();for(const p of stats.people)if(!peopleIds.has(p.name.toLowerCase()))peopleIds.set(p.name.toLowerCase(),p.id);
 $('#people').innerHTML=stats.people.map(p=>`<option value="${esc(p.name)}">${p.images} photo${p.images===1?'':'s'}</option>`).join('');}catch{}}

/* ---- start screen ---- */
function start(){$('#status').innerHTML='';
 $('#main').innerHTML=`<section class="start"><h3>Find the photo while you write.</h3>
 <p>Describe it in a sentence, the way you would ask the photo desk: who is in it, what is happening, where. Names, years and Hinglish are understood.</p>
 <div class="cols">${Object.entries(STARTERS).map(([h,qs])=>`<div><h4>${h}</h4>${qs.map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`).join('')}</div></section>`}

/* ---- loader: a dotted globe turning while the archive is searched ---- */
const STEPS=['reading the query','looking at how photos look','reading captions and descriptions','checking who is in the frame','judging every candidate'];
let orb=null;
function showLoader(){const n=stats?stats.images.toLocaleString('en-IN'):'the';
 $('#main').innerHTML=`<div class="loader"><div class="orbwrap"><canvas id="orb" width="480" height="480" aria-hidden="true"></canvas>
 <div class="ltitle">Searching <b>${n}</b> photos</div><div class="lstep" id="lstep">${STEPS[0]}</div></div></div>`;
 startOrb($('#orb'));
 let i=0;orb.step=setInterval(()=>{const el=$('#lstep');if(!el){clearInterval(orb.step);return}el.classList.add('swap');setTimeout(()=>{i=(i+1)%STEPS.length;el.textContent=STEPS[i];el.classList.remove('swap')},200)},900)}
function startOrb(c){stopOrb();const ctx=c.getContext('2d'),N=520,pts=[],phi=Math.PI*(3-Math.sqrt(5));
 for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=phi*i;pts.push([Math.cos(t)*r,y,Math.sin(t)*r])}
 const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim(),acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
 const still=matchMedia('(prefers-reduced-motion:reduce)').matches;let a=0,t0=performance.now();
 const draw=now=>{const W=c.width,H=c.height,R=W*0.44,cx=W/2,cy=H/2;ctx.clearRect(0,0,W,H);
 a=still?0.6:(now-t0)/1000*0.7;const tilt=0.42,ca=Math.cos(a),sa=Math.sin(a),ct=Math.cos(tilt),st=Math.sin(tilt);
 const out=[];for(const [x,y,z] of pts){const x1=x*ca+z*sa,z1=-x*sa+z*ca,y1=y*ct-z1*st,z2=y*st+z1*ct;const p=1/(1.75-z2*0.45);out.push([cx+x1*R*p,cy+y1*R*p,z2,p])}
 out.sort((p,q)=>p[2]-q[2]);
 for(const [x,y,z,p] of out){const d=(z+1)/2;ctx.globalAlpha=0.12+d*0.88;ctx.fillStyle=d>0.985?acc:ink;ctx.beginPath();ctx.arc(x,y,(1.1+d*2.6)*p*1.4,0,6.283);ctx.fill()}
 ctx.globalAlpha=1;if(!still)orb.raf=requestAnimationFrame(draw)};
 orb={raf:0,step:0};orb.raf=requestAnimationFrame(draw)}
function stopOrb(){if(orb){cancelAnimationFrame(orb.raf);clearInterval(orb.step);orb=null}}

/* ---- search ---- */
let inflight=0,prevMain='',prevStatus='';
function failed(retry){stopOrb();$('#main').innerHTML=prevMain;
 $('#status').innerHTML=`<span class="warn">The archive did not answer.</span><button type="button" class="retry" id="retry">Try again</button>`;$('#retry').onclick=retry}
async function run(){const q=$('#q').value.trim(),pid=personId();if(!q&&!pid)return;
 const p=new URLSearchParams({q:q||'*'});if(pid)p.append('person',pid);if($('#yf').value)p.set('year_from',$('#yf').value);if($('#yt').value)p.set('year_to',$('#yt').value);
 history.replaceState(null,'','?'+new URLSearchParams({q,...(DEBUG?{debug:1}:{})}));$('#clear').hidden=!q;
 $('#yearctl').classList.toggle('on',!!($('#yf').value||$('#yt').value));$('#personctl').classList.toggle('on',!!pid);
 const id=++inflight;
 if(res){prevMain=$('#main').innerHTML;prevStatus=$('#status').innerHTML}
 $('#status').innerHTML='';
 showLoader();
 const t0=performance.now();let r;
 try{r=await (await fetch('/api/search?'+p)).json()}catch(e){if(id!==inflight)return;failed(run);return}
 if(id!==inflight)return;
 if(q)remember(q);suggestions();res=r;render(r,performance.now()-t0)}

async function similar(x,backQ){const id=++inflight;if(res){prevMain=$('#main').innerHTML}
 history.replaceState(null,'','?'+new URLSearchParams({similar:x.id,...(DEBUG?{debug:1}:{})}));
 $('#q').value='';$('#clear').hidden=true;$('#status').innerHTML='';showLoader();window.scrollTo(0,0);
 const t0=performance.now();let r;
 try{r=await (await fetch('/api/similar/'+x.id)).json()}catch(e){if(id!==inflight)return;failed(()=>similar(x,backQ));return}
 if(id!==inflight)return;
 r.query=`similar to ${x.id}`;r.similar_to=x;r.back=backQ||'';res=r;render(r,performance.now()-t0)}

function statusLine(r,ms){const n=r.results.length,best=r.results.filter(x=>x.tier==='match').length;
 if(r.similar_to){const x=r.similar_to;return `<span><b>${n}</b> similar photo${n===1?'':'s'}</span><span class="sim"><img src="${x.thumb}" alt="">${(t=>t?esc(t.slice(0,60))+(t.length>60?'…':''):'')(x.caption||x.headline||x.vlm?.summary||'')}</span>
 <button type="button" class="back" ${r.back?`data-q="${esc(r.back)}"`:'data-home'}>← ${r.back?`back to “${esc(r.back)}”`:'start over'}</button><span class="ms">${Math.round(ms)} ms</span>`}
 const who=(r.persons||[]).map(p=>`<span class="tag person ${p.p_link<0.5?'maybe':''}">${esc(p.name)}${p.p_link<0.5?'?':''}</span>`).join('');
 const yrs=(r.years||[])[0]?`<span class="tag">${r.years[0]}${r.years[1]&&r.years[1]!==r.years[0]?'–'+r.years[1]:''}</span>`:'';
 const rew=r.parsed?.rewrite&&r.parsed.rewrite.toLowerCase()!==r.query.toLowerCase()?`<span class="tag" title="How the query was read">read as “${esc(r.parsed.rewrite)}”</span>`:'';
 const missing=(r.persons_missing||[]).length?`<span class="warn">No photos of ${r.persons_missing.map(esc).join(', ')} in the archive yet.</span>`:'';
 const count=!n?'<b>No</b> confident match':r.query==='*'?`<b>${n}</b> photo${n===1?'':'s'}`:!best?`<b>No</b> strong match, <b>${n}</b> possible`:`<b>${n}</b> photo${n===1?'':'s'}${best<n?`, <b>${best}</b> strong`:''}`;
 return `<span>${count}</span>
 ${who||yrs||rew?`<span class="understood">${who}${yrs}${rew}</span>`:''}${missing}<span class="ms">${Math.round(ms)} ms</span>`}

function card(x,i){const ar=(x.width&&x.height)?Math.min(Math.max(x.width/x.height,0.5),2.6):1.5;
 const text=x.caption||x.headline||x.vlm?.summary||'',ai=!x.caption&&!x.headline&&!!text;
 const ppl=x.people,who=ppl.length?`<span class="p1">${esc(ppl[0])}</span>${ppl[1]?`<span class="p2">${esc(ppl[1])}</span>`:''}${ppl.length>2?`<span class="n2">+${ppl.length-2}</span>`:''}${ppl.length>1?`<span class="n1">+${ppl.length-1}</span>`:''}`
 :(x.people_possible?.length?`<span class="maybe">${esc(x.people_possible[0])}?</span>`:'');
 return `<figure class="ph" style="--ar:${ar.toFixed(3)}" data-i="${i}" tabindex="0" role="button" aria-label="${esc(text.slice(0,120))}">
 <img loading="lazy" src="${x.thumb}" alt="" onload="this.classList.add('in')">
 ${who?`<div class="who">${who}</div>`:''}
 <figcaption class="cap"><div class="m">${x.date?`<span>${fmtDate(x.date)}</span>`:''}${x.city?`<span>${esc(x.city)}</span>`:''}${ai?'<span class="src">AI description</span>':''}</div><div class="t">${esc(text)}</div></figcaption></figure>`}

function render(r,ms){stopOrb();$('#status').innerHTML=statusLine(r,ms);
 if(!r.results.length){$('#main').innerHTML=`<div class="empty"><h3>Nothing confident for “${esc(r.query)}”.</h3>
 <p>Try naming what is visible in the frame: the place, the activity, the people. Or widen the year range.</p>
 <div class="sugg">${EXAMPLES.slice(0,4).map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`;return}
 const best=r.results.map((x,i)=>[x,i]).filter(([x])=>x.tier!=='possible'),more=r.results.map((x,i)=>[x,i]).filter(([x])=>x.tier==='possible');
 const sec=(cls,title,items,note)=>items.length?`<section class="tier ${cls}"><h2 class="${cls}">${title}<small>${items.length}</small></h2>${note?`<p class="note">${note}</p>`:''}<div class="rows">${items.map(([x,i])=>card(x,i)).join('')}</div></section>`:'';
 $('#main').innerHTML=sec('best',r.similar_to?'Similar photos':'Best matches',best)+sec('more','Also consider',more,best.length||r.query==='*'?'':'Nothing matched strongly. These are the closest photos; check them before using one.');}
$('#main').addEventListener('click',e=>{const c=e.target.closest('.ph');if(c)open(+c.dataset.i)});
$('#main').addEventListener('keydown',e=>{const c=e.target.closest('.ph');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(+c.dataset.i)}});

/* ---- viewer ---- */
const V=$('#viewer');
function open(i){cur=i;show();if(!V.open)V.showModal();
 const x=res.results[i];fetch('/api/click',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:res.query,image_id:x.id,rank:i+1,action:'open'})})}
function show(){const x=res.results[cur],v=x.vlm||{};const big=$('#big');big.src=x.thumb;$('#boxes').innerHTML='';
 big.onload=()=>{if(!DEBUG||!(x.faces||[]).length)return;const b=$('#boxes');const r=big.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();
 b.style.cssText=`left:${r.left-s.left}px;top:${r.top-s.top}px;width:${r.width}px;height:${r.height}px`;
 b.innerHTML=x.faces.map(f=>{const [bx,by,bw,bh]=f.bbox;return `<div class="box" style="left:${100*bx/x.width}%;top:${100*by/x.height}%;width:${100*bw/x.width}%;height:${100*bh/x.height}%">${f.name?`<em>${esc(f.name)} ${f.score}</em>`:''}</div>`}).join('')};
 $('#counter').textContent=`${cur+1} / ${res.results.length}`;$('#prev').style.visibility=cur>0?'visible':'hidden';$('#next').style.visibility=cur<res.results.length-1?'visible':'hidden';
 const people=[...x.people.map(p=>`<span>${esc(p)}</span>`),...(x.people_possible||[]).map(p=>`<span class="maybe" title="Likely, not confirmed">${esc(p)}?</span>`)].join('');
 const described=v.summary&&v.summary!==x.caption?`<p class="ai"><small>What the photo shows</small>${esc(v.summary)}</p>`:'';
 const facts=[['Date',x.date?fmtDate(x.date):null],['Place',[x.city,v.location_guess&&!x.city?v.location_guess:null].filter(Boolean).join(', ')||null],
 ['People',people?`<div class="people">${people}</div>`:null],['Photographer',x.byline],['Credit',x.credit],
 ['Keywords',(x.keywords||[]).length?`<div class="kw">${x.keywords.slice(0,12).map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:null],
 ['Size',x.width&&x.height?`${x.width} × ${x.height}`:null],['File',x.file?`<span class="mono">${esc(x.file.split('/').pop())}</span>`:null]];
 const dbg=DEBUG?`<div class="debug">relevance ${x.relevance} context ${x.p_ctx} person ${x.p_person??'—'}\nvia ${(x.why||[]).join(', ')}\n${(x.people_sources||[]).map(p=>`${p.name} ${p.score} [${(p.evidence||[]).join(' ')}]`).join('\n')}\n${esc(JSON.stringify(v,null,1))}</div>`:'';
 $('#panel').innerHTML=`<div class="head"><span class="k">${esc(x.id.slice(0,8))}</span><button class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
 <div class="body">${x.caption?`<p class="caption">${esc(x.caption)}</p>`:x.headline?`<p class="caption">${esc(x.headline)}</p>`:`<p class="caption">${esc(v.summary||'No caption')}</p>`}
 ${x.headline&&x.caption?`<p class="headline">${esc(x.headline)}</p>`:''}${x.caption?described:''}
 <dl class="facts">${facts.filter(([,v])=>v).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${dbg}</div>
 <div class="actions"><a class="btn primary" href="${x.original}" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0 5-5m-5 5-5-5M4 20h16"/></svg>Download original</a>
 <button class="btn" id="copyid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>Copy ID</button>
 <button class="btn" id="more">More like this</button></div>`;
 $('#close').onclick=()=>V.close();$('#copyid').onclick=()=>{navigator.clipboard?.writeText(x.id);toast('Photo ID copied')};
 $('#more').onclick=()=>{V.close();similar(x,res.similar_to?res.back:$('#q').value.trim())}}
$('#prev').onclick=()=>{if(cur>0){cur--;show()}};$('#next').onclick=()=>{if(cur<res.results.length-1){cur++;show()}};
V.addEventListener('click',e=>{if(e.target===V||e.target.id==='stage')V.close()});
V.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='ArrowRight')$('#next').click()});

/* ---- boot ---- */
document.addEventListener('click',e=>{if(e.target.closest('[data-home]'))$('#home').click()});
suggestions();loadStats();
{const sp=new URLSearchParams(location.search),q=sp.get('q'),sim=sp.get('similar');
 if(sim)similar({id:sim,thumb:`/thumbs/${sim}.jpg`},'');else if(q){$('#q').value=q;$('#clear').hidden=false;run()}else start()}
</script>
